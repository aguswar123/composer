name: Apply patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: Patch file name (in the repo root)
        required: true
        default: 0005-android-timeline-editor.patch
      message:
        description: Commit message
        required: true
        default: "Android: timeline editor with draggable word and line boundaries"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Apply patch, remove it, commit and push
        env:
          PATCH: ${{ inputs.patch }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          test -f "$PATCH" || { echo "::error::$PATCH not found in repo root"; exit 1; }
          git apply --check "$PATCH"
          git apply --index "$PATCH"
          git rm -q -f -- "$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push
